; PlatformIO Project Configuration File
; Board: ESP32-S3-N16R8 (16MB Flash, 8MB PSRAM Octal) + camera OV3660 / OV2640

[env:esp32-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi   ; Quad Flash + Octal PSRAM (đúng cho N16R8)
board_upload.flash_size = 16MB
; App partition ~6.25MB (huge_app.csv chỉ ~3MB, không đủ cho model 3.3MB + code)
board_build.partitions = default_16MB.csv

; Framework tự set sẵn -Os và 1 cờ -std=gnu++.. cũ: phải gỡ trước rồi mới thêm bản mình cần.
build_unflags =
    -Os
    -std=gnu++11
    -std=gnu++14
    -std=gnu++2a
    -std=c++11
    -std=c++14

build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1

    ; Các cờ bật/tắt tính năng (BLE log, VIEW, NN_*...) nằm trong src/robot/RobotConfig.h, KHÔNG đặt ở đây (tránh 2 nguồn sự thật).

    ; --- Tối ưu phần cứng Xtensa LX7 (ESP32-S3 Vector/DSP & FPU) ---
    -mfix-esp32-psram-cache-issue
    -freorder-blocks-algorithm=simple
    
    ; --- TFLite Micro Flags ---
    -DTF_LITE_STATIC_MEMORY
    -DTF_LITE_DISABLE_X86_NEON
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Ilib/TFLiteMicro/src/third_party/gemmlowp
    -Ilib/TFLiteMicro/src/third_party/flatbuffers/include
    -Ilib/TFLiteMicro/src/third_party/ruy
    -Ilib/TFLiteMicro/src/third_party/kissfft

    ; --- Src subfolders (để #include không cần ghi đường dẫn đầy đủ) ---
    -Isrc/camera
    -Isrc/vision
    -Isrc/model
    -Isrc/robot
    -Isrc/utils

    ; --- fast-kernels headers (ConvCore.h, FastOpsCore.h, ...) ---
    -Ilib/fast-kernels/include

    ; --- ESP-NN Flags ---
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED=1
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -DCONFIG_IDF_TARGET_ARCH_XTENSA=1
    -Ilib/esp-nn/include
    -Ilib/esp-nn/src/common

; Nếu build lỗi ở phần esp-nn: bỏ dấu ; ở dòng dưới để tắt hẳn esp-nn, đồng thời
; xoá 5 dòng -DESP_NN ... -Ilib/esp-nn/src/common ở trên. Firmware quay về kernel chuẩn.
;lib_ignore = esp-nn

monitor_speed = 115200
upload_speed = 921600

; TFLiteMicro và esp-nn KHÔNG có trong PlatformIO Registry: chạy
;   python tools/setup_libs.py
; để tải về và dựng vào lib/ (chỉ cần làm 1 lần).
lib_deps =
    espressif/esp32-camera @ ^2.0.4
    https://github.com/adafruit/Adafruit_VL53L0X.git
    https://github.com/adafruit/Adafruit_MPU6050.git
    https://github.com/adafruit/Adafruit_BusIO.git
    https://github.com/adafruit/Adafruit_Sensor.git
    h2zero/NimBLE-Arduino @ ~1.4.2